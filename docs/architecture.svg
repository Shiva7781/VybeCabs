<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="1" stop-color="#2a1f5c"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b9a8ff"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <text x="40" y="58" font-size="34" font-weight="700" fill="#ffffff">Vybe Cabs</text>
  <text x="40" y="88" font-size="17" fill="#b9a8ff">Real-time driver allocation · exactly one driver wins</text>

  <!-- Rider -->
  <rect x="40" y="170" width="130" height="64" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="105" y="200" font-size="17" font-weight="700" fill="#231d5a" text-anchor="middle">Rider</text>
  <text x="105" y="221" font-size="12" fill="#555" text-anchor="middle">POST /rides</text>

  <!-- API -->
  <rect x="245" y="150" width="170" height="104" rx="10" fill="#7b5cff"/>
  <text x="330" y="186" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">NestJS API</text>
  <text x="330" y="210" font-size="12" fill="#efeaff" text-anchor="middle">allocation engine</text>
  <text x="330" y="230" font-size="12" fill="#efeaff" text-anchor="middle">state machine</text>

  <!-- Redis -->
  <rect x="245" y="300" width="170" height="110" rx="10" fill="#d82c20"/>
  <text x="330" y="330" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Redis</text>
  <text x="330" y="352" font-size="12" fill="#ffe3e0" text-anchor="middle">GEOSEARCH nearby</text>
  <text x="330" y="371" font-size="12" fill="#ffe3e0" text-anchor="middle">Lua atomic SET NX</text>
  <text x="330" y="390" font-size="12" fill="#ffe3e0" text-anchor="middle">BullMQ timeouts</text>

  <!-- Mongo -->
  <rect x="40" y="320" width="130" height="70" rx="10" fill="#13aa52"/>
  <text x="105" y="351" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">MongoDB</text>
  <text x="105" y="372" font-size="12" fill="#e6fff0" text-anchor="middle">rides · audit trail</text>

  <!-- Drivers -->
  <rect x="560" y="120" width="200" height="56" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="580" y="154" font-size="16" font-weight="700" fill="#231d5a">Driver A</text>
  <rect x="680" y="134" width="66" height="28" rx="14" fill="#13aa52"/>
  <text x="713" y="153" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">WON</text>

  <rect x="560" y="198" width="200" height="56" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="580" y="232" font-size="16" font-weight="700" fill="#231d5a">Driver B</text>
  <rect x="680" y="212" width="66" height="28" rx="14" fill="#c0392b"/>
  <text x="713" y="231" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">409</text>

  <rect x="560" y="276" width="200" height="56" rx="10" fill="#ffffff" opacity="0.95"/>
  <text x="580" y="310" font-size="16" font-weight="700" fill="#231d5a">Driver C</text>
  <rect x="680" y="290" width="66" height="28" rx="14" fill="#c0392b"/>
  <text x="713" y="309" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">409</text>

  <!-- Arrows -->
  <g stroke="#b9a8ff" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M170 202H240"/>
    <path d="M330 254V295"/>
    <path d="M245 300L175 335"/>
    <path d="M415 185L555 148"/>
    <path d="M415 202L555 226"/>
    <path d="M415 220L555 304"/>
  </g>
  <text x="470" y="140" font-size="12" fill="#b9a8ff">Socket.IO offer</text>
  <text x="560" y="372" font-size="13" fill="#ffffff">Concurrent accepts → one atomic</text>
  <text x="560" y="392" font-size="13" fill="#ffffff">Lua check-and-set in Redis</text>
</svg>
